[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4.15.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
reqwest = "0.13.4"

